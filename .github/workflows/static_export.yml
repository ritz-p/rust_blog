name: Export Tool Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

jobs:
  build-export-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-checks
        with:
          build-tools: "false"

      - name: Build export tools
        run: |
          docker compose exec -T web cargo build --release --target x86_64-unknown-linux-gnu -p rust_blog --bin export --bin seed
          docker compose exec -T web cargo build --release --target x86_64-unknown-linux-gnu -p migration --bin migration

      - name: Assemble export bundle
        shell: bash
        run: |
          BUNDLE_DIR="artifact/rust-blog-export-tools-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          mkdir -p "${BUNDLE_DIR}/templates"
          docker compose cp web:/tmp/rust-blog-target/x86_64-unknown-linux-gnu/release/export "${BUNDLE_DIR}/export"
          docker compose cp web:/tmp/rust-blog-target/x86_64-unknown-linux-gnu/release/seed "${BUNDLE_DIR}/seed"
          docker compose cp web:/tmp/rust-blog-target/x86_64-unknown-linux-gnu/release/migration "${BUNDLE_DIR}/migration"
          cp -R templates/. "${BUNDLE_DIR}/templates/"

      - name: Package export bundle
        shell: bash
        run: |
          cd artifact
          tar -czf "rust-blog-export-tools-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" \
            "rust-blog-export-tools-${{ github.ref_name }}-x86_64-unknown-linux-gnu"

      - name: Upload export bundle
        uses: actions/upload-artifact@v7
        with:
          name: rust-blog-export-tools-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: artifact/rust-blog-export-tools-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

      - name: Stop containers
        if: always()
        run: docker compose down
