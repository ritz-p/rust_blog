name: Export articles and deploy

on:
  schedule:
    # Mondays at 09:07 JST (00:07 UTC).
    - cron: "7 0 * * 1"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the exported site to Cloudflare
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARTICLE_PATH: content/articles
  FIXED_CONTENT_PATH: content/fixed_contents
  RUST_BLOG_CONFIG_PATH: blog_config.toml
  RUST_BLOG_CONTENT_DIR: content
  RUST_BLOG_TEMPLATES_DIR: templates
  EXPORT_OUTPUT_DIR: dist
  EXPORT_DATABASE_PATH: artifact/static-export/blog.db

concurrency:
  group: cloudflare-static
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.event_name != 'schedule' || vars.STATIC_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start development container
        run: docker compose up -d web

      - name: Export all Markdown articles
        run: |
          docker compose exec -T --user root \
            -e ARTICLE_PATH -e FIXED_CONTENT_PATH -e RUST_BLOG_CONFIG_PATH \
            -e RUST_BLOG_CONTENT_DIR -e RUST_BLOG_TEMPLATES_DIR -e EXPORT_OUTPUT_DIR \
            -e EXPORT_DATABASE_PATH \
            web sh docker/export-articles.sh

      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: ${{ env.EXPORT_OUTPUT_DIR }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload export database
        uses: actions/upload-artifact@v7
        with:
          name: static-site-database
          path: ${{ env.EXPORT_DATABASE_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'schedule' && vars.STATIC_SCHEDULE_ENABLED == 'true') }}
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: static-site
          path: ${{ env.EXPORT_OUTPUT_DIR }}

      - name: Deploy to Cloudflare Workers Static Assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ${{ env.EXPORT_OUTPUT_DIR }}
