name: Cargo Test

on:
  pull_request:
    branches:
      - "develop"
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".env"
      - "Rocket.toml"
      - "blog_config.toml"
      - ".cargo/**"
      - "rust-toolchain*"
      - "ci/Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".dockerignore"
      - ".github/actions/prepare-checks/action.yml"
      - ".github/workflows/cargo_test.yml"

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-checks
        with:
          build-tools: "false"

      - name: Run test
        run: docker compose exec -T web cargo test --workspace

      - name: Stop containers
        if: always()
        run: docker compose down
