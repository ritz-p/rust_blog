name: Markdown

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

permissions:
  contents: read

concurrency:
  group: markdown-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-checks

      - name: Install pinned Markdown lint dependencies
        run: docker compose exec -T --user root web npm ci

      - name: Lint Markdown
        run: docker compose exec -T --user root web npm run lint:md

      - name: Validate and check article front matter
        run: |
          docker compose exec -T --user root web .ci-tools/format_markdown --check content/articles

      - name: Stop containers
        if: always()
        run: docker compose down
