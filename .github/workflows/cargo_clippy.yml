name: Cargo Clippy

on:
  pull_request:
    branches:
      - "develop"
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-checks
        with:
          build-tools: "false"

      - name: Run Clippy
        run: docker compose exec -T web cargo clippy --workspace --all-targets -- -D warnings

      - name: Stop containers
        if: always()
        run: docker compose down
