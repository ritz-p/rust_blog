name: Cargo Fmt

on:
  pull_request:
    branches:
      - "develop"
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

permissions:
  contents: write

concurrency:
  group: cargo-fmt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: ./.github/actions/prepare-checks
        with:
          build-tools: "false"

      - name: Format
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: docker compose exec -T web cargo fmt --all

      - name: Commit formatting
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add -u -- '*.rs'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply cargo fmt"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Check formatting
        run: docker compose exec -T web cargo fmt --all -- --check

      - name: Stop containers
        if: always()
        run: docker compose down
