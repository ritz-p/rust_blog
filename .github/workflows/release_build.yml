name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install linker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Install Rust and cache Cargo
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build project
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Rename artifact
        shell: bash
        run: |
          mv target/x86_64-unknown-linux-gnu/release/rust_blog \
             target/x86_64-unknown-linux-gnu/release/rust_blog-${{ github.ref_name }}-x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust_blog-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/rust_blog-${{ github.ref_name }}-x86_64-unknown-linux-gnu
