name: Release Build

on:
  push:
    tags:
      - "v*"

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-checks
        with:
          build-tools: "false"

      - name: Build project
        run: docker compose exec -T web cargo build --release --target x86_64-unknown-linux-gnu

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p artifact
          docker compose cp \
            web:/tmp/rust-blog-target/x86_64-unknown-linux-gnu/release/rust_blog \
            "artifact/rust_blog-${{ github.ref_name }}-x86_64-unknown-linux-gnu"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust_blog-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: artifact/rust_blog-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          if-no-files-found: error

      - name: Stop containers
        if: always()
        run: docker compose down
