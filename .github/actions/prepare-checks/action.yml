name: Prepare container and cached tools
description: Build CI image and optionally reuse tools for identical Rust build inputs
inputs:
  build-tools:
    description: Build and cache Markdown and export helper binaries
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/Dockerfile
        tags: rust-blog-ci:local
        load: true
        cache-from: type=gha,scope=checks-image
        cache-to: type=gha,mode=max,scope=checks-image
    - uses: actions/cache@v6
      if: inputs.build-tools == 'true'
      id: tools
      with:
        path: .ci-tools
        key: checks-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', 'core/src/**', 'core/assets/**', 'migration/src/**', 'templates/**', 'ci/Dockerfile', 'docker/build-check-tools.sh', '.github/actions/prepare-checks/action.yml') }}
    - name: Start CI container
      shell: bash
      run: docker compose up -d --no-build web
    - name: Build checks tools on cache miss
      if: inputs.build-tools == 'true' && steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: docker compose exec -T web sh docker/build-check-tools.sh
